services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistics-fleet-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: logistics_db
      DB_USERNAME: logistics_user
      DB_PASSWORD: logistics_secret_pass
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - ./backend:/var/www/html/backend
    depends_on:
      db:
        condition: service_healthy
    networks:
      - logistics-network

  db:
    image: mysql:8.0
    container_name: logistics-fleet-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: logistics_db
      MYSQL_USER: logistics_user
      MYSQL_PASSWORD: logistics_secret_pass
      MYSQL_ROOT_PASSWORD: root_secret_pass
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret_pass"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - logistics-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: logistics-fleet-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - logistics-network

volumes:
  db_data:
    driver: local

networks:
  logistics-network:
    driver: bridge
